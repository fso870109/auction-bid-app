# Header overrides for the existing auction-bid-app static site.
# This file documents the intended Cache-Control for sw.js. Applying it as a
# Render Blueprint would require dashboard approval and is not auto-applied.
services:
  - type: web
    runtime: static
    name: auction-bid-app
    buildCommand: "true"
    staticPublishPath: .
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /app.js
        name: Cache-Control
        value: no-cache
